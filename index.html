<style>
:root{--ink:#2a1e3f;--paper:#fbf5ee;--card:#fff;--line:#e3d8cc;--muted:#7a6f86;--accent:#e8604c;--gold:#f2b84b;--good:#3b8f5a;--bad:#d2443a;
 --sel:#ffe2a8;--same:#fff1d6;--given:#8a7a9c;--word:#f6eee4;--cw:clamp(21px,7.4vw,34px)}
@media (prefers-color-scheme:dark){:root{--ink:#efe8f6;--paper:#16111f;--card:#211a2e;--line:#3a3049;--muted:#a597b5;--sel:#6b4d1f;--same:#3a2f22;--given:#b3a4c6;--word:#2a2238}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#2a1e3f;color:#fbf5ee;display:flex;align-items:center;gap:8px;
 padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px)}
.brand{flex:1;min-width:0;font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand svg{width:26px;height:26px;flex:none}
.hb{background:rgba(255,255,255,.13);border:0;border-radius:10px;padding:7px 11px;color:inherit}
.hb[hidden]{display:none}
main{max-width:760px;margin:0 auto;padding:16px calc(env(safe-area-inset-right) + 14px) 40px calc(env(safe-area-inset-left) + 14px)}
h1{font-size:24px;margin:4px 0 2px}h2{font-size:19px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.next{display:flex;gap:14px;align-items:center;border:2px solid var(--accent);width:100%;text-align:left}
.next .big{font-size:38px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:800}
.story{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.story .em{font-size:32px;width:44px;text-align:center;flex:none}
.story .t{font-weight:700}.story .b{color:var(--muted);font-size:14px}
.dots{display:flex;gap:4px;margin-top:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--good)}
.lock{margin-left:auto;font-size:18px;opacity:.7}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.chap{width:100%;text-align:left}
.chap.done p{margin:6px 0 0}
.chap.todo{border:2px solid var(--accent)}
.chap.locked{opacity:.5}
.promo{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.promo .em{font-size:30px}
/* puzzle */
body.play main{padding-bottom:calc(env(safe-area-inset-bottom) + 200px)}
.ptitle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ptitle b{font-size:17px}.ptitle span{color:var(--muted);font-size:14px}
.board{display:flex;flex-wrap:wrap;gap:14px calc(var(--cw)*.85);padding:14px 6px;justify-content:flex-start}
.w{display:flex;gap:3px;background:var(--word);border-radius:8px;padding:2px 3px}
.c{width:var(--cw);display:flex;flex-direction:column;align-items:center;border-radius:6px;padding:2px 0 1px;user-select:none}
.c .g{height:calc(var(--cw)*1.05);width:100%;display:flex;align-items:flex-end;justify-content:center;font-weight:800;font-size:calc(var(--cw)*.72);
 border-bottom:2px solid var(--ink);line-height:1}
.c .k{font-size:calc(var(--cw)*.38);color:var(--muted);margin-top:2px;font-weight:600;letter-spacing:.3px}
.c.p{width:auto;min-width:8px}.c.p .g{border-bottom-color:transparent}
.c.same{background:var(--same)}.c.cur{background:var(--sel)}
.c.giv .g{color:var(--given);border-bottom-color:var(--line)}
.c.bad .g{color:var(--bad)}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.tools button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
.msg{text-align:center;color:var(--muted);min-height:22px;font-size:14px}
.kb{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);
 padding:8px calc(env(safe-area-inset-right) + 4px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 4px)}
.kr{display:flex;justify-content:center;gap:5px;margin:5px auto;max-width:560px}
.kr button{flex:1;max-width:52px;height:46px;border:0;border-radius:8px;background:var(--paper);font-size:18px;font-weight:700;box-shadow:0 1px 0 var(--line)}
.kr button.used{opacity:.35}
.kr button.wide{max-width:76px;flex:1.5;font-size:16px}
/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:rgba(20,12,30,.55);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.sheet{background:var(--card);border-radius:20px 20px 0 0;max-width:560px;width:100%;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow:auto}
@media(min-width:700px){.sheet{border-radius:20px}}
.sheet h3{margin:0 0 6px;font-size:21px}
.sheet .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.reveal{font-size:18px;line-height:1.55;font-family:Georgia,"Times New Roman",serif;background:var(--paper);border-radius:12px;padding:14px;margin:10px 0}
.reveal p{margin:0 0 10px}
.price{font-size:28px;font-weight:800}
ul.ticks{padding-left:20px;margin:8px 0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:12px;z-index:50;font-size:15px}
.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
</style>

<script>
// True stories and real science, each told in 5 coded chapters. Written for this app; facts only from well-documented sources.
// Digits and punctuation are shown as-is (only letters are coded). Add new batches as stories2.js etc.
const CATS = [
 {id:'builders', title:'Builders & inventors', sub:'Real lives, real lessons.'},
 {id:'brain', title:'Your brain & ADHD', sub:'Strange and useful things neuroscience has found.'},
];
const STORIES = [
{id:'franklin', cat:'builders', emoji:'🪁', title:'Benjamin Franklin', blurb:'A teenage runaway who retired at 42.', ch:[
 "At 17, Benjamin Franklin ran away from his apprenticeship in Boston. He arrived in Philadelphia with one Dutch dollar and some copper coins.",
 "He bought three big bread rolls and walked up Market Street eating one, with the other two under his arms. His future wife saw him and thought he looked ridiculous.",
 "He built a printing business, published Poor Richard's Almanack for 25 years, and stepped back from daily business at 42.",
 "With his free time, he flew a kite in a storm to show that lightning is electricity, then invented the lightning rod.",
 "He never patented his inventions. He wrote that we should be glad to serve others by any invention of ours, freely and generously."],
 lesson:'Buy back your time early, then spend it on work that matters to you.'},
{id:'adhd', cat:'brain', emoji:'🧠', title:'Inside the ADHD brain', blurb:'Why some brains run on interest.', ch:[
 "ADHD is one of the most inherited conditions in psychiatry. Twin studies estimate that around 70 to 80 percent of the risk comes from genes.",
 "Research links ADHD to differences in dopamine signalling, the brain chemistry behind motivation, reward and getting started.",
 "That is why boring tasks feel like pushing a boulder, while interesting ones can trigger hyperfocus that lasts for hours.",
 "Psychologist Russell Barkley calls ADHD a disorder of time. The future feels less real, so deadlines only feel urgent when they are very close.",
 "Exercise raises dopamine and norepinephrine. Studies show that even one short workout can sharpen attention in people with ADHD."],
 lesson:'It is not a lack of willpower. Make tasks interesting, make time visible, and move your body.'},
{id:'wright', cat:'builders', emoji:'✈️', title:'The Wright brothers', blurb:'Two brothers with a bike shop beat the experts.', ch:[
 "Wilbur and Orville Wright never received high school diplomas. They paid for their flying experiments with money from their bicycle shop in Ohio.",
 "When the published data on wing lift turned out to be wrong, they built their own wind tunnel and tested about 200 wing shapes.",
 "No company could sell them an engine that was light enough, so their shop mechanic, Charlie Taylor, built one in about six weeks.",
 "On December 17, 1903, Orville flew for 12 seconds and 120 feet. Only five local people were there to watch.",
 "Few newspapers believed them. It took almost five more years of quiet work before public flights in France made them world famous."],
 lesson:'When the experts are wrong, test it yourself.'},
{id:'curie', cat:'builders', emoji:'⚗️', title:'Marie Curie', blurb:'A secret school, a cold attic, and a glowing discovery.', ch:[
 "Marie Curie grew up in Warsaw, where women could not go to university. She studied at a secret school that moved from house to house.",
 "In Paris she lived in a cold attic and sometimes piled every piece of clothing she owned on her bed to keep warm at night.",
 "With her husband Pierre, she discovered two new elements. She named the first one polonium, after her homeland, Poland.",
 "She was the first woman to win a Nobel Prize, and she is still the only person to win Nobel Prizes in two different sciences.",
 "Her notebooks are still radioactive more than a century later. They are kept in lead lined boxes at the national library in Paris."],
 lesson:'Hard conditions are not a stop sign. Keep going.'},
{id:'brainfacts', cat:'brain', emoji:'🔬', title:'Strange brain discoveries', blurb:'Five findings that sound made up.', ch:[
 "Your brain is about 2 percent of your body weight, but it uses around 20 percent of your body's energy.",
 "London taxi drivers must memorise thousands of streets. Brain scans showed that part of their hippocampus, a memory centre, grew larger.",
 "In 1848 an iron rod shot through the head of railway worker Phineas Gage. He survived, but friends said he was no longer the same man.",
 "After brain surgery, a patient known as H.M. could not form new memories, yet he still got better at new skills like drawing in a mirror.",
 "While you sleep, your brain washes itself. A system of fluid flushes out waste much faster during sleep than when you are awake."],
 lesson:'Your brain is physical, it changes with use, and it needs sleep to clean itself.'},
{id:'edison', cat:'builders', emoji:'💡', title:'Thomas Edison', blurb:'Deaf, barely schooled, and endlessly curious.', ch:[
 "Thomas Edison had only a few months of school. His mother taught him at home, and he lost most of his hearing as a boy.",
 "At Menlo Park he built one of the first industrial research labs, aiming for a small invention every ten days and a big one every six months.",
 "To find a lasting light bulb filament, his team tested thousands of materials. Carbonised bamboo finally glowed for over a thousand hours.",
 "In December 1914, a huge fire destroyed much of his factory in West Orange. He was 67 years old.",
 "Watching it burn, he said there is great value in disaster, because all our mistakes are burned up. Within weeks, the factory was running again."],
 lesson:'Make lots of attempts, and treat setbacks as a fresh start.'},
{id:'plastic', cat:'brain', emoji:'🌱', title:'The brain that rewires itself', blurb:'Can an adult brain really change?', ch:[
 "For most of the 20th century, scientists believed the adult brain was fixed. Research since the 1990s has shown it keeps changing.",
 "Adults who learned to juggle for three months showed visible growth in brain areas for motion. When they stopped, some of it faded.",
 "Some children who had half of their brain removed to stop severe seizures grew up to walk, talk and live largely normal lives.",
 "Blind people who read braille use their visual cortex to process touch. The brain hands unused space to a new job.",
 "Every time you practise a skill, you strengthen the connections that support it. You can keep doing this for your whole life."],
 lesson:'Practice literally changes your brain, at any age.'},
{id:'walker', cat:'builders', emoji:'🧴', title:'Madam C. J. Walker', blurb:'From laundry tubs to a fortune.', ch:[
 "Sarah Breedlove was born in Louisiana in 1867, the first child in her family born free. She was an orphan by the age of seven.",
 "For years she worked as a washerwoman, earning about a dollar and a half a day, while raising her daughter on her own.",
 "Struggling with hair loss, she developed her own hair care products and sold them door to door as Madam C. J. Walker.",
 "She trained thousands of women as sales agents, giving them income and independence that few other jobs offered at the time.",
 "She is often called the first self made female millionaire in America, and she gave generously to schools and charities."],
 lesson:'Solve your own problem first. Others probably have it too.'},
{id:'disney', cat:'builders', emoji:'🐭', title:'Walt Disney', blurb:'He lost everything, so he started over.', ch:[
 "Walt Disney's first animation studio in Kansas City went bankrupt. He moved to Hollywood with a suitcase and very little money.",
 "In 1928 he lost the rights to his hit character, Oswald the Lucky Rabbit, and most of his animators, to his distributor.",
 "So he created a new character: a mouse. Steamboat Willie, one of the first cartoons with synchronised sound, made Mickey a star.",
 "Hollywood called his plan for a feature length cartoon Disney's Folly. Snow White went far over budget, to nearly 1.5 million dollars.",
 "It became the most successful sound film of its time. Losing Oswald pushed him to own everything he created from then on."],
 lesson:'Own what you build.'},
{id:'shackleton', cat:'builders', emoji:'🧊', title:'Ernest Shackleton', blurb:'A shipwreck at the end of the world.', ch:[
 "In 1915, Ernest Shackleton's ship Endurance became trapped in Antarctic sea ice, far from any chance of rescue.",
 "The ice slowly crushed the ship. The 28 men camped on drifting ice for months, then took lifeboats to Elephant Island.",
 "Shackleton and five men sailed a small lifeboat about 800 miles across one of the stormiest oceans on Earth to South Georgia.",
 "They landed on the wrong side of the island and crossed its icy mountains on foot, with screws from the boat in their boots for grip.",
 "Every man of the Endurance crew survived. In 2022, the wreck was found 3,000 metres down, remarkably well preserved."],
 lesson:'Morale is a leader\'s first job.'},
{id:'jobs', cat:'builders', emoji:'🍎', title:'Steve Jobs', blurb:'Lost his company, then came back stronger.', ch:[
 "After dropping out of college, Steve Jobs sat in on a calligraphy class for fun. Ten years later, it shaped the fonts of the first Mac.",
 "In 1985, at the age of 30, he was pushed out of Apple, the company he had started with a friend.",
 "He founded a new computer company called NeXT, and bought a small computer graphics group from Lucasfilm that became Pixar.",
 "In 1995 Pixar released Toy Story, the first feature film made entirely with computer animation.",
 "Apple then bought NeXT and brought him back. He later said that getting fired from Apple was the best thing that could have happened to him."],
 lesson:'You can only connect the dots looking backwards, so follow your curiosity.'},
];
const FREE_IDS = ['franklin','adhd','wright'];

// Batch 2 (2026-11-20): female founders, people power (nonviolent movements), sleep.
CATS.splice(1,0,
 {id:'women', title:'Female founders', sub:'Women who built something from almost nothing.'},
 {id:'people', title:'People power', sub:'Peaceful protests that changed history.'});
STORIES.find(s=>s.id==='walker').cat='women';
STORIES.push(
{id:'blakely', cat:'women', emoji:'👖', title:'Sara Blakely', blurb:'A pair of scissors and a big idea.', ch:[
 "Sara Blakely sold fax machines door to door for seven years. When she was a child, her father asked every week what she had failed at.",
 "Getting ready for a party, she cut the feet off her pantyhose to look smooth under cream trousers. The idea for Spanx was born.",
 "With 5,000 dollars of savings, she wrote her own patent application with help from a textbook, to save on lawyer fees.",
 "Factories turned her down until one owner's daughters told him the idea was brilliant. In 2000, Oprah Winfrey named Spanx a favourite thing.",
 "In 2012, Forbes named her the youngest self made woman billionaire in the world. She owned all of the company for over 20 years."],
 lesson:'Failure is feedback. Ask yourself what you failed at this week.'},
{id:'singing', cat:'people', emoji:'🎶', title:'The Singing Revolution', blurb:'What if your only weapon was a choir?', ch:[
 "In 1988, hundreds of thousands of Estonians gathered at the Tallinn Song Festival Grounds to sing patriotic songs that had been banned.",
 "On August 23, 1989, about two million people joined hands in a human chain called the Baltic Way, about 675 kilometres long.",
 "The chain linked Tallinn, Riga and Vilnius. It marked 50 years since a secret pact between Hitler and Stalin had divided Eastern Europe.",
 "On August 20, 1991, while Soviet tanks were heading for Tallinn, Estonia declared that its independence was restored.",
 "Within days, the coup in Moscow collapsed. A nation of about 1.5 million had won its freedom largely by singing together."],
 lesson:'Culture can be stronger than tanks when people hold on to it together.'},
{id:'salt', cat:'people', emoji:'🧂', title:'The Salt March', blurb:'A pinch of something everyone needs.', ch:[
 "In 1930, Britain ruled India and taxed salt, a basic need for everyone. Indians were forbidden to collect or sell their own.",
 "Mahatma Gandhi chose salt for his protest because everyone, rich or poor, Hindu or Muslim, could understand that injustice.",
 "He set out with 78 followers on a walk of about 385 kilometres to the sea at Dandi. It took 24 days, and crowds grew in every village.",
 "On the beach, he picked up a lump of natural salt and broke the law. People across India began making salt themselves.",
 "Tens of thousands were arrested. The march did not win independence at once, but it showed the world that peaceful defiance could shake an empire."],
 lesson:'Pick a cause so simple that everyone can join in.'},
{id:'marykay', cat:'women', emoji:'💗', title:'Mary Kay Ash', blurb:'A company built on the golden rule.', ch:[
 "Mary Kay Ash spent decades in direct sales. When a man she had trained was promoted over her at twice her pay, she quit.",
 "She began writing a book of advice for women in business, and realised she was describing her dream company.",
 "In 1963, a month before the launch, her husband died of a heart attack. Her sons urged her to go ahead anyway, and she did.",
 "She started with about 5,000 dollars and nine saleswomen. Her motto was to treat other people as you would like to be treated.",
 "Her top sellers won pink Cadillacs. The company grew into one of the biggest direct sales businesses in the world."],
 lesson:'Build the place you wish you had worked.'},
{id:'montgomery', cat:'people', emoji:'🚌', title:'The Montgomery Bus Boycott', blurb:'Walking instead of riding, for over a year.', ch:[
 "On December 1, 1955, in Montgomery, Alabama, Rosa Parks refused to give up her bus seat to a white passenger. She was arrested.",
 "She later wrote that the only tired she was, was tired of giving in. She had worked for civil rights for many years.",
 "Black residents, who were most of the bus riders, stopped using the buses. A young pastor named Martin Luther King Jr. helped lead them.",
 "For 381 days, people walked to work, shared cars and organised their own rides, despite threats and even bombings.",
 "In 1956, the Supreme Court ruled that segregation on the buses was against the law. Ordinary people had shown the power of saying no together."],
 lesson:'Many small sacrifices, shared, can move a whole system.'},
{id:'sleep', cat:'brain', emoji:'😴', title:'Why your brain needs sleep', blurb:'What happens when you never switch off?', ch:[
 "In 1964, a 17 year old student named Randy Gardner stayed awake for about 11 days for a school science fair project.",
 "By the end he struggled to focus, remember and speak clearly. Scientists now warn that experiments like his are dangerous.",
 "While rats sleep, their brains replay the routes they learned in a maze that day. Sleep helps lock new memories in.",
 "During dream sleep, most of your muscles are switched off, which stops you from acting out your dreams.",
 "Staying awake for about 18 hours can slow your reactions as much as having drunk enough alcohol to be over the driving limit in many countries."],
 lesson:'Sleep is not lost time. It is when your brain files the day.'},
{id:'roddick', cat:'women', emoji:'🌿', title:'Anita Roddick', blurb:'A shop that refused to waste anything.', ch:[
 "In 1976, Anita Roddick opened a small shop in Brighton, England, to support her two daughters while her husband was away.",
 "He was riding a horse from Buenos Aires to New York. She needed an income fast, and borrowed about 4,000 pounds.",
 "She sold natural skin creams in cheap plastic bottles bought from hospitals, and offered refills so nothing went to waste.",
 "Two funeral parlours nearby complained about her shop's name, The Body Shop. She told a newspaper, and the story gave her free publicity.",
 "The Body Shop campaigned against animal testing and grew to thousands of stores worldwide. Roddick left her fortune to charity."],
 lesson:'Your values can be your best marketing.'},
{id:'iceland', cat:'people', emoji:'🇮🇸', title:"Iceland's day off", blurb:'One day without them, and a country stopped.', ch:[
 "On October 24, 1975, about 90 percent of the women in Iceland refused to work, cook or look after children for the whole day.",
 "Banks, factories and schools struggled to open. Shops sold out of sausages, an easy meal for fathers who suddenly had to cook.",
 "About 25,000 women gathered in the centre of Reykjavik, in a country of only about 220,000 people.",
 "Five years later, Iceland elected Vigdis Finnbogadottir, the first woman in the world democratically elected as a national president.",
 "Iceland has topped world rankings for gender equality for many years. Women there call that day the Long Friday."],
 lesson:'When everyone steps back at once, their value becomes impossible to ignore.'},
{id:'handler', cat:'women', emoji:'🎀', title:'Ruth Handler', blurb:'She watched her daughter play, and saw a gap.', ch:[
 "Ruth Handler co-founded the toy company Mattel with her husband Elliot. She ran the business, and he designed the toys.",
 "She noticed her daughter Barbara playing with paper dolls, imagining them as grown women with jobs and lives of their own.",
 "Toy buyers said no mother would buy a doll with a grown woman's body. She launched it anyway at the 1959 toy fair, named after Barbara.",
 "Barbie sold hundreds of thousands of dolls in her first year. Her boyfriend Ken was later named after Ruth's son.",
 "After surviving breast cancer, Ruth started a second company that made realistic breast prostheses for other women."],
 lesson:'Watch how people really behave. The gap is often in plain sight.'},
{id:'leipzig', cat:'people', emoji:'🕯️', title:'The night the Wall opened', blurb:'Candles, chants and a fumbled announcement.', ch:[
 "In autumn 1989, people in Leipzig, East Germany, began marching every Monday evening after prayers for peace at a church.",
 "On October 9, about 70,000 people marched through the city carrying candles and chanting: We are the people.",
 "Soldiers and police were ready, and many feared a massacre. But the crowd stayed peaceful, and not a single shot was fired.",
 "A month later, an official in Berlin read out new travel rules at a press conference and wrongly said they started immediately.",
 "That night, huge crowds gathered at the Berlin Wall until the guards opened the gates. Within a year, Germany was reunited."],
 lesson:'Peaceful crowds can make force useless.'},
);
FREE_IDS.push('blakely','singing');

  if(!priceText){try{const r=await shop.call('getProduct');priceText=r.price||''}catch(e){}}}};
if(NATIVE){shop.refresh();document.addEventListener('visibilitychange',()=>{if(!document.hidden)shop.refresh()});
 try{const St=window.Capacitor.registerPlugin('Store');St.addListener('entitlement',r=>shop.set(r.unlocked))}catch(e){}}
function maybeAskReview(){if(!NATIVE)return;const n=Object.keys(S.solved).length;S.asks=S.asks||[];
 for(const at of [5,20,60])if(n>=at&&!S.asks.includes(at)){S.asks.push(at);save();setTimeout(()=>shop.call('requestReview').catch(()=>{}),1500);break}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s), app=$('#app');
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AZ='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const byId=id=>STORIES.find(s=>s.id===id);
const isFree=id=>FREE_IDS.includes(id);
const canPlay=id=>S.unlocked||isFree(id);
const pid=(id,i)=>id+'-'+i;
const known=st=>!!S.solved[pid(st.id,0)];
const T=st=>known(st)?st.title:'Who or what is it?';
const E=st=>known(st)?st.emoji:'❔';
const doneCount=st=>st.ch.filter((_,i)=>S.solved[pid(st.id,i)]).length;

function rng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
function makePuzzle(id,i){
 const text=byId(id).ch[i], r=rng('ct:'+id+':'+i);
 let perm;
 do{perm=AZ.split('');for(let j=25;j>0;j--){const k=Math.floor(r()*(j+1));[perm[j],perm[k]]=[perm[k],perm[j]]}}while(perm.some((c,j)=>c===AZ[j]));
 const enc={};AZ.split('').forEach((c,j)=>enc[c]=perm[j]);
 const up=text.toUpperCase(), letters=[...new Set(up.replace(/[^A-Z]/g,''))];
 // given letters: more help early in each story
 const nGive=[4,3,3,2,2][i]||2;
 const pool=letters.slice();for(let j=pool.length-1;j>0;j--){const k=Math.floor(r()*(j+1));[pool[j],pool[k]]=[pool[k],pool[j]]}
 const given=pool.slice(0,nGive).map(p=>enc[p]);
 return {text,up,enc,given,cipherLetters:letters.map(p=>enc[p]),dec:Object.fromEntries(letters.map(p=>[enc[p],p]))};
}

// ---------- routing ----------
function go(h){location.hash=h}
window.addEventListener('hashchange',render);
$('#back').onclick=()=>{const h=location.hash;const m=h.match(/^#\/p\/(\w+)/);go(m?'#/s/'+m[1]:'#/')};
$('#help').onclick=showHelp;

function render(){
 closeOv();document.body.classList.remove('play');const kb=$('.kb');if(kb)kb.remove();
 const h=location.hash||'#/';let m;
 if((m=h.match(/^#\/p\/(\w+)\/(\d)$/))&&byId(m[1])){if(!canPlay(m[1])){go('#/s/'+m[1]);return}return renderPuzzle(m[1],+m[2])}
 if((m=h.match(/^#\/s\/(\w+)$/))&&byId(m[1]))return renderStory(m[1]);
 renderHome();
}
function nextUp(){
 for(const st of STORIES){if(!canPlay(st.id))continue;const n=doneCount(st);if(n<st.ch.length)return {st,i:n}}
 return null;
}
function renderHome(){
 $('#back').hidden=true;$('#ttl').textContent='Riddle & Ruckus';window.scrollTo(0,0);
 const nu=nextUp();
 let h=`<h1>Riddle &amp; Ruckus</h1><p class="sub">True stories and real science, in secret code. Crack each line to learn what happened next.</p>`;
 if(nu){const started=doneCount(nu.st)>0;h+=`<button class="card next" data-go="#/p/${nu.st.id}/${nu.i}"><span class="big">${E(nu.st)}</span><span><span class="lbl">${started?'Next up':'Start here'}</span><br><b>${esc(T(nu.st))}</b><br><span class="sub">Chapter ${nu.i+1} of ${nu.st.ch.length}</span></span></button>`}
 else if(!S.unlocked)h+=`<div class="card"><b>You finished all the free stories!</b><p class="sub" style="margin:4px 0 10px">Unlock every story for one small price.</p><button class="btn" data-pay>See all stories</button></div>`;
 for(const cat of CATS){h+=`<h2>${esc(cat.title)}</h2><p class="sub" style="margin-top:-4px">${esc(cat.sub)}</p>`;
 for(const st of STORIES.filter(x=>x.cat===cat.id)){const n=doneCount(st),lk=!canPlay(st.id);
  h+=`<button class="card story" data-go="#/s/${st.id}"><span class="em">${E(st)}</span><span><span class="t">${esc(T(st))}</span><br><span class="b">${esc(st.blurb)}</span><span class="dots">${st.ch.map((_,i)=>`<i class="${S.solved[pid(st.id,i)]?'on':''}"></i>`).join('')}</span></span>${lk?'<span class="lock">🔒</span>':(n===st.ch.length?'<span class="lock">✅</span>':'')}</button>`}
 }
 h+=`<p class="sub" style="text-align:center;margin-top:14px">More stories are on the way.</p>`;
 h+=`<h2>More from us</h2><a class="card promo" href="${MM_URL}" target="_blank" rel="noopener"><span class="em">🔎</span><span><b>Mischief &amp; Motive</b><br><span class="sub" style="margin:0">Logic grid puzzles about ridiculous crimes. Same makers, no ads.</span></span></a>`;
 if(!S.unlocked)h+=`<div style="text-align:center;margin-top:16px"><button class="btn ghost" data-pay>Unlock all stories</button></div>`;
 app.innerHTML=h;bind();
}
function renderStory(id){
 const st=byId(id),lk=!canPlay(id);$('#back').hidden=false;$('#ttl').textContent=T(st);window.scrollTo(0,0);
 let h=`<h1>${E(st)} ${esc(T(st))}</h1><p class="sub">${esc(st.blurb)}</p>`;
 if(lk){h+=`<div class="card"><b>🔒 This story is part of the full collection.</b><p class="sub" style="margin:4px 0 10px">One payment unlocks every story, including new ones we add later.</p><button class="btn" data-pay>Unlock all stories</button></div>`;app.innerHTML=h;bind();return}
 const n=doneCount(st);
 st.ch.forEach((t,i)=>{
  if(S.solved[pid(id,i)])h+=`<div class="card chap done"><span class="lbl" style="color:var(--good)">Chapter ${i+1}</span><p class="reveal" style="margin:6px 0 0">${esc(t)}</p></div>`;
  else if(i===n)h+=`<button class="card chap todo" data-go="#/p/${id}/${i}"><span class="lbl">Chapter ${i+1} · next up</span><br><b>Tap to crack the code</b></button>`;
  else h+=`<div class="card chap locked"><span class="lbl" style="color:var(--muted)">Chapter ${i+1}</span><br>Solve the chapter before to read this one.</div>`;
 });
 if(n===st.ch.length){const nx=nextUp();h+=`<div class="card" style="text-align:center"><b>🎉 The end!</b>${st.lesson?`<p class="reveal" style="text-align:left"><b>Lesson:</b> ${esc(st.lesson)}</p>`:'<br>'}${nx?`<button class="btn" style="margin-top:10px" data-go="#/s/${nx.st.id}">Next story</button>`:(!S.unlocked?`<button class="btn" style="margin-top:10px" data-pay>Unlock more stories</button>`:'')}</div>`}
 app.innerHTML=h;bind();
}
function bind(){
 app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 app.querySelectorAll('[data-pay]').forEach(b=>b.onclick=showPay);
}

// ---------- puzzle ----------
let P,cur,cells,bad;
function renderPuzzle(id,i){
 const st=byId(id);$('#back').hidden=false;$('#ttl').textContent=T(st);
 if(i>doneCount(st)){go('#/s/'+id);return}
 document.body.classList.add('play');window.scrollTo(0,0);
 P=makePuzzle(id,i);P.id=pid(id,i);P.st=st;P.i=i;bad=new Set();
 const g=S.g[P.id]||{};P.guess={};
 P.given.forEach(c=>P.guess[c]=P.dec[c]);(S.hints[P.id]||[]).forEach(c=>{if(P.dec[c]){P.guess[c]=P.dec[c];P.given.push(c)}});
 for(const c in g)if(!P.given.includes(c)&&P.dec[c])P.guess[c]=g[c];
 const solvedAlready=!!S.solved[P.id];
 if(solvedAlready)P.cipherLetters.forEach(c=>P.guess[c]=P.dec[c]);
 let h=`<div class="ptitle"><b>${E(st)} Chapter ${i+1} of ${st.ch.length}</b><span>Each letter stands for another letter.</span></div><div class="card"><div class="board" id="board">`;
 cells=[];let idx=0;
 for(const word of P.up.split(/\s+/)){
  h+='<span class="w">';
  for(const ch of word){
   if(/[A-Z]/.test(ch)){const k=P.enc[ch];h+=`<span class="c" data-i="${idx}" data-k="${k}"><span class="g"></span><span class="k">${k}</span></span>`;cells.push(k);idx++}
   else h+=`<span class="c p"><span class="g">${esc(ch)}</span><span class="k">&nbsp;</span></span>`;
  }
  h+='</span>';
 }
 h+=`</div></div><div class="msg" id="msg"></div><div class="tools"><button id="hint">💡 Hint</button><button id="check">✔︎ Check</button><button id="clear">↺ Clear</button></div>`;
 app.innerHTML=h;
 const kb=document.createElement('div');kb.className='kb';
 kb.innerHTML=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].map((r,ri)=>`<div class="kr">${ri===2?'<button class="wide" data-key="Prev">◀</button>':''}${r.split('').map(c=>`<button data-key="${c}">${c}</button>`).join('')}${ri===2?'<button class="wide" data-key="Backspace">⌫</button>':''}</div>`).join('');
 document.body.appendChild(kb);
 kb.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();key(b.dataset.key)}));
 app.querySelectorAll('.c[data-i]').forEach(el=>el.onclick=()=>{cur=+el.dataset.i;draw()});
 $('#hint').onclick=hint;$('#check').onclick=check;$('#clear').onclick=clearAll;
 fitWords();cur=firstOpen(0);if(cur<0)cur=0;draw();
 if(solvedAlready)$('#msg').textContent='Already solved. Nice!';
}
function fitWords(){const bd=$('#board');if(!bd)return;const W=bd.clientWidth-12;
 bd.querySelectorAll('.w').forEach(w=>{w.style.removeProperty('--cw');if(w.offsetWidth>W){const cw=parseFloat(getComputedStyle(w.querySelector('.c')).width);w.style.setProperty('--cw',Math.floor(cw*W/w.offsetWidth)+'px')}})}
window.addEventListener('resize',()=>{if(document.body.classList.contains('play'))fitWords()});
const isGiven=k=>P.given.includes(k);
function firstOpen(from){for(let j=0;j<cells.length;j++){const n=(from+j)%cells.length;if(!P.guess[cells[n]])return n}return -1}
function draw(){
 const k=cells[cur];
 app.querySelectorAll('.c[data-i]').forEach(el=>{const kk=el.dataset.k,gs=P.guess[kk]||'';
  el.querySelector('.g').textContent=gs;
  el.classList.toggle('giv',isGiven(kk));el.classList.toggle('same',kk===k);el.classList.toggle('cur',+el.dataset.i===cur);
  el.classList.toggle('bad',bad.has(kk));
 });
 const used=new Set(Object.values(P.guess));
 document.querySelectorAll('.kb [data-key]').forEach(b=>b.classList.toggle('used',used.has(b.dataset.key)));
 const el=app.querySelector(`.c[data-i="${cur}"]`);if(el){const r=el.getBoundingClientRect(),kbh=($('.kb')||{}).offsetHeight||0;
  if(r.bottom>innerHeight-kbh-10||r.top<70)el.scrollIntoView({block:'center',behavior:'smooth'})}
}
function persist(){const o={};for(const c in P.guess)if(!isGiven(c))o[c]=P.guess[c];S.g[P.id]=o;save()}
function key(k){
 if(!P||S.solved[P.id])return;
 const c=cells[cur];
 if(k==='Backspace'){if(!isGiven(c)&&P.guess[c]){delete P.guess[c];bad.delete(c)}else{cur=(cur-1+cells.length)%cells.length}persist();draw();return}
 if(k==='Prev'||k==='ArrowLeft'){cur=(cur-1+cells.length)%cells.length;draw();return}
 if(k==='ArrowRight'){cur=(cur+1)%cells.length;draw();return}
 if(!/^[A-Z]$/.test(k))return;
 if(isGiven(c)){const n=firstOpen(cur);if(n>=0)cur=n;draw();return}
 for(const o in P.guess)if(P.guess[o]===k&&o!==c){if(isGiven(o)){toast(`${k} is already used`);return}delete P.guess[o];bad.delete(o)}
 P.guess[c]=k;bad.delete(c);persist();
 if(solved())return win();
 const n=firstOpen(cur);if(n>=0)cur=n;else{$('#msg').textContent='Every letter is filled, but something is not right yet. Try Check.'}
 draw();
}
function solved(){return P.cipherLetters.every(c=>P.guess[c]===P.dec[c])}
function hint(){
 if(S.solved[P.id])return;
 let c=cells[cur];if(P.guess[c]===P.dec[c])c=P.cipherLetters.find(x=>P.guess[x]!==P.dec[x]);if(!c)return;
 const p=P.dec[c];for(const o in P.guess)if(P.guess[o]===p&&o!==c)delete P.guess[o];
 P.guess[c]=p;P.given.push(c);bad.delete(c);(S.hints[P.id]=S.hints[P.id]||[]).push(c);persist();
 if(solved())return win();
 const n=firstOpen(cur);if(n>=0)cur=n;draw();
}
function check(){
 bad=new Set(P.cipherLetters.filter(c=>P.guess[c]&&P.guess[c]!==P.dec[c]));
 $('#msg').textContent=bad.size?`${bad.size} letter${bad.size>1?'s are':' is'} wrong (shown in red).`:'Everything so far is correct. Keep going!';draw();
}
function clearAll(){for(const c in P.guess)if(!isGiven(c))delete P.guess[c];bad.clear();persist();cur=firstOpen(0);if(cur<0)cur=0;$('#msg').textContent='';draw()}
function win(){
 S.solved[P.id]=true;save();maybeAskReview();draw();$('#ttl').textContent=P.st.title;
 app.querySelectorAll('.c[data-i]').forEach((el,j)=>setTimeout(()=>el.classList.add('pop'),j*12));
 const st=P.st,i=P.i,last=i===st.ch.length-1;
 setTimeout(()=>{
  let h=`<div class="sheet"><h3>${last?'🎉 Story complete!':(i===0?`✨ Cracked it! ${st.emoji} ${esc(st.title)}`:'✨ Cracked it!')}</h3><div class="reveal">`;
  h+=last?st.ch.map(t=>`<p>${esc(t)}</p>`).join(''):`<p>${esc(st.ch[i])}</p>`;
  if(last&&st.lesson)h+=`<p><b>Lesson:</b> ${esc(st.lesson)}</p>`;
  h+=`</div><div class="row">`;
  if(!last)h+=`<button class="btn" data-go="#/p/${st.id}/${i+1}">Next chapter →</button><button class="btn ghost" data-go="#/s/${st.id}">Story so far</button>`;
  else{const nx=nextUp();h+=nx?`<button class="btn" data-go="#/p/${nx.st.id}/${nx.i}">Next story</button>`:(!S.unlocked?`<button class="btn" data-pay>Get more stories</button>`:'');h+=`<button class="btn ghost" data-go="#/">All stories</button>`}
  h+=`</div></div>`;openOv(h);
 },700);
}
window.addEventListener('keydown',e=>{
 if(!document.body.classList.contains('play')||$('.ov')||e.metaKey||e.ctrlKey||e.altKey)return;
 const k=e.key.length===1?e.key.toUpperCase():e.key;
 if(/^[A-Z]$/.test(k)||['Backspace','ArrowLeft','ArrowRight'].includes(k)){e.preventDefault();key(k)}
});

// ---------- overlays ----------
function openOv(inner){closeOv();const o=document.createElement('div');o.className='ov';o.innerHTML=inner;document.body.appendChild(o);
 o.onclick=e=>{if(e.target===o)closeOv()};
 o.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closeOv();const t=b.dataset.go;if(location.hash===t)render();else go(t)});
 o.querySelectorAll('[data-pay]').forEach(b=>b.onclick=showPay);
 o.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeOv);return o}
function closeOv(){document.querySelectorAll('.ov').forEach(o=>o.remove())}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function showHelp(){openOv(`<div class="sheet"><h3>How to play</h3>
<p>Each chapter of a story is written in a secret code. Every letter has been swapped for a different letter, and the swap stays the same all through that chapter.</p>
<p>The small letter under each box is the code. Tap a box, then type the real letter you think it is. Every box with the same code letter fills in at once.</p>
<ul class="ticks"><li>Grey letters are given to you as a start.</li><li>Short words help: a one letter word is usually A or I, and THE is very common.</li><li><b>Hint</b> reveals the selected letter. <b>Check</b> shows wrong letters in red.</li></ul>
<p>Solve a chapter to read it and unlock the next part of the story.</p>
<div class="row"><button class="btn" data-close>Got it</button></div></div>`)}
function showPay(){
 if(S.unlocked){openOv(`<div class="sheet"><h3>All stories unlocked</h3><p>Thank you! Every story is yours, including new ones we add.</p><div class="row"><button class="btn" data-close>OK</button></div></div>`);return}
 const perks=`<ul class="ticks"><li>All ${STORIES.length} stories now, plus every new story we add</li><li>No ads, ever</li><li>No subscription</li></ul>`;
 if(WEBSITE){const o=openOv(`<div class="sheet"><h3>Get the full app</h3><p>This free demo has ${FREE_IDS.length} stories. The app for iPhone and Android has all of them, for one small payment.</p>${perks}
<div class="row">${STORE_LINK?`<a class="btn" style="text-decoration:none" href="${STORE_LINK}" target="_blank" rel="noopener">Get the full app</a>`:`<button class="btn" disabled>Coming soon to ${STORE_NAME}</button>`}<button class="btn ghost" data-close>Not now</button></div></div>`);return}
 const price=NATIVE?priceText:'$4.99';
 const o=openOv(`<div class="sheet"><h3>Unlock every story</h3>${price?`<div class="price">${esc(price)} <span style="font-size:15px;font-weight:600;color:var(--muted)">one time</span></div>`:''}${perks}
${TESTMODE?'<p class="sub" style="margin:0">Test version: this button unlocks for free. Real payment happens in the App Store and Google Play apps.</p>':''}
<p class="msg" id="paymsg"></p>
<div class="row"><button class="btn" id="buy">${TESTMODE?'Unlock (test)':'Unlock all'}</button><button class="btn ghost" id="restore">Restore purchase</button><button class="btn ghost" data-close>Not now</button></div></div>`);
 const msg=o.querySelector('#paymsg');
 if(NATIVE&&!priceText)shop.refresh().then(()=>{if(priceText&&!o.querySelector('.price'))o.querySelector('h3').insertAdjacentHTML('afterend',`<div class="price">${esc(priceText)} <span style="font-size:15px;font-weight:600;color:var(--muted)">one time</span></div>`)});
 async function run(m,btn){
  if(TESTMODE){if(m==='purchase'){S.unlocked=true;save();closeOv();toast('Unlocked. Enjoy!');render()}else msg.textContent='Nothing to restore in the test version.';return}
  btn.disabled=true;msg.textContent=m==='purchase'?`Talking to ${STORE_NAME}…`:'Checking your purchases…';
  try{const r=await shop.call(m);
   if(r.unlocked){shop.set(true);closeOv();toast('All stories unlocked. Enjoy!');render()}
   else if(r.pending)msg.textContent='Waiting for approval. The stories unlock as soon as it goes through.';
   else if(r.cancelled)msg.textContent='';
   else msg.textContent=m==='restore'?`No earlier purchase found on this ${ANDROID?'Google account':'Apple ID'}.`:'The purchase did not go through.';
  }catch(e){msg.textContent=`Could not reach ${STORE_NAME}. Check your connection and try again.`}
  btn.disabled=false}
 o.querySelector('#buy').onclick=e=>run('purchase',e.currentTarget);
 o.querySelector('#restore').onclick=e=>run('restore',e.currentTarget);
}
render();
if(!localStorage.getItem(KEY+'-seenhelp')){try{localStorage.setItem(KEY+'-seenhelp','1')}catch(e){}if(!location.hash||location.hash==='#/')setTimeout(showHelp,300)}
})();
</script>
