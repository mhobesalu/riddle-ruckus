# Uploads the App Store listing (texts in fastlane/metadata, screenshots in fastlane/screenshots)
# to App Store Connect for version 1.0. It does NOT upload a build and does NOT submit for review.
# Run it from GitHub: Actions → "App Store listing upload" → Run workflow.
# Uses the same secrets as "iOS release to TestFlight": ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY.
name: App Store listing upload
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Store version to fill in'
        required: true
        default: '1.0'
jobs:
  listing:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install fastlane
        run: gem install fastlane --no-document
      - name: Write API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 - <<'PY'
          import json, os
          d = {"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
               "key": os.environ["ASC_PRIVATE_KEY"], "in_house": False}
          json.dump(d, open(os.path.join(os.environ["RUNNER_TEMP"], "keys", "api.json"), "w"))
          PY
      - name: Upload texts and screenshots
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          fastlane deliver --api_key_path "$RUNNER_TEMP/keys/api.json" \
            --app_identifier ee.silgrowth.riddleruckus --platform ios --app_version "$VERSION" \
            --metadata_path fastlane/metadata --screenshots_path fastlane/screenshots \
            --skip_binary_upload true --overwrite_screenshots true \
            --submit_for_review false --run_precheck_before_submit false --force true
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
