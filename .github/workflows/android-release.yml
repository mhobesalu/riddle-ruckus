# Builds the signed Android App Bundle (.aab) for Google Play.
# Run it from GitHub: Actions → "Android release" → Run workflow.
# Needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional, for automatic upload to Google Play as a DRAFT Production release
# (someone still presses "Send for review" in Play Console):
#   PLAY_SERVICE_ACCOUNT_JSON   JSON key of a Google Cloud service account invited in Play Console
name: Android release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in Google Play (e.g. 1.0, 1.1)'
        required: true
        default: '1.0'
      notes:
        description: "What's new (English, shown in Google Play)"
        required: false
        default: ''
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        working-directory: native
        run: |
          npm ci
          node build-web.js
          npx cap sync android
      - name: Write upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
      - name: Build signed bundle
        working-directory: native/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.event.inputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"
      - name: Save the .aab file
        uses: actions/upload-artifact@v4
        with:
          name: riddle-ruckus-${{ github.event.inputs.version }}-${{ github.run_number }}
          path: native/android/app/build/outputs/bundle/release/app-release.aab
      - name: Write release notes
        if: env.HAS_PLAY_KEY == 'true' && github.event.inputs.notes != ''
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          mkdir -p whatsnew
          printf '%s' "$NOTES" > whatsnew/whatsnew-en-US
      - name: Upload to Google Play (draft Production release)
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ee.silgrowth.riddleruckus
          releaseFiles: native/android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: draft
          releaseName: ${{ github.run_number }} (${{ github.event.inputs.version }})
          whatsNewDirectory: ${{ github.event.inputs.notes != '' && 'whatsnew' || '' }}
